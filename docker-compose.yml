services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"   # REST + dashboard at http://localhost:6333/dashboard
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      LOG_JSON: "true"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped
